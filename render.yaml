# Render Blueprint - deploy with "New > Blueprint" and this repo.
services:
  - type: web
    name: ipl-auction
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Pin ONE secret and every password is stable across deploys - team
      # passwords are derived in code from the team name + this value, so
      # teams added later from the Admin page stay stable too. Set the value
      # in the Render dashboard (sync: false means Render asks you for it).
      - key: AUCTION_ADMIN_PASSWORD
        sync: false
      # Optional: hand-pick specific passwords instead of the derived ones,
      # e.g. admin=admin-854,warriors=warriors19,T007=newteam42
      # - key: AUCTION_PASSWORDS
      #   sync: false
    # Free instances have an EPHEMERAL disk: every deploy/restart wipes
    # data/auction.json AND regenerates data/auth.json (new passwords - read
    # them from the startup log). Fine for trying it out; for a real event
    # move to the Starter plan and uncomment the disk below.
    # disk:
    #   name: auction-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # ...and add:
    # envVars:
    #   - key: AUCTION_DATA_DIR
    #     value: /var/data
